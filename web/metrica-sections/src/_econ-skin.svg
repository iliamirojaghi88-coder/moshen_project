  <filter id="mcF14" filterUnits="userSpaceOnUse" x="-300" y="-300" width="3200" height="1400"><feGaussianBlur stdDeviation="14"/></filter>

  <clipPath id="mcBody"><path data-g="body"/></clipPath>
  <clipPath id="mcAbove"><path data-g="above"/></clipPath>
