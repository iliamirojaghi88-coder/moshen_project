    <g clip-path="url(#mcAboveLip)">
      <path d="M440 202C480 197.5 515 193.5 550 188C570 184.9 600 178.8 620 174C645 168 672 153.8 690 138" fill="none" stroke="url(#mcWarm)" stroke-width="22" opacity=".45" filter="url(#mcF8)"/>
      <path d="M440 202C480 197.5 515 193.5 550 188C570 184.9 600 178.8 620 174C645 168 672 153.8 690 138" fill="none" stroke="#e8892a" stroke-width="8" opacity=".85" filter="url(#mcF2)"/>
