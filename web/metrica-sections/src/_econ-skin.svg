    <path data-g="neon" fill="none" stroke="#0752b4" stroke-width="80" opacity=".9" filter="url(#mcF14)"/>
    <path data-g="neon" fill="none" stroke="#0aa2f6" stroke-width="28" filter="url(#mcF4)"/>
    <path data-g="neon" fill="none" stroke="#4fe4ff" stroke-width="9" filter="url(#mcF2)"/>
  </g>
  <path data-g="below" fill="url(#mcLip)"/>
