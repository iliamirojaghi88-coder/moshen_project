<!-- 4 · rim and neon cores on top -->
<path data-g="body" fill="none" stroke="#fff" stroke-width="1.7" opacity=".95" mask="url(#mcRimMask)"/>
<path data-g="neon" fill="none" stroke="url(#mcNeonFade)" stroke-width="6" opacity=".8" filter="url(#mcF2)"/>
<path data-g="neon" fill="none" stroke="#f3feff" stroke-width="2.3"/>
