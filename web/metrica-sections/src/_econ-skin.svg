    <path d="M440 202C480 197.5 515 193.5 550 188C570 184.9 600 178.8 620 174C645 168 672 153.8 690 138C700 129.2 709 118 711 112" fill="none" stroke="url(#mcLipLine)" stroke-width="2"/>
    <path d="M535 190.4C558 186.9 590 181 622 173.5" fill="none" stroke="url(#mcGlintRun)" stroke-width="11" opacity=".75" filter="url(#mcF4)"/>
    <path d="M535 190.4C558 186.9 590 181 622 173.5" fill="none" stroke="url(#mcGlintRun)" stroke-width="3.6" filter="url(#mcF1)"/>
    <ellipse cx="600" cy="180.3" rx="14" ry="2.6" transform="rotate(-14 600 180.3)" fill="url(#mcHot)" opacity=".9"/>
