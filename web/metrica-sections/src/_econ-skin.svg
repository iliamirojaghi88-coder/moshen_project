    <rect x="4" y="139" width="8" height="30" rx="1"/><rect x="19" y="125" width="10" height="44" rx="1"/>
    <rect x="31" y="108" width="10" height="61" rx="1"/><rect x="43" y="123" width="10" height="46" rx="1"/>
  </g>
