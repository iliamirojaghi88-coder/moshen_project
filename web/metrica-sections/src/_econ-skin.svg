  <path d="M470 7C515 1.5 560-9 600-16C620-19.4 632-20 648-20C655-20 715.8-13 715.8 42C716.2 60 714.4 78 711 97L640 70L470 30Z" fill="url(#mcRibbonFill)"/>
  <g clip-path="url(#mcRibbon)">
    <path d="M420 6.5C470 7.9 560 3 640 0C670.7 0 711 22.5 711 87.1L711 104" fill="none" stroke="#fcc63a" stroke-width="20" opacity=".9" filter="url(#mcF4)"/>
