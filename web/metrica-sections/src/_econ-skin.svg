  <path d="M470 7C515 1.5 560-9 600-16C620-19.4 632-20 648-20C655-20 715.8-13 715.8 42C716.2 60 714.4 78 711 97" fill="none" stroke="#fffbea" stroke-width="1.6" opacity=".95"/>
  <path d="M455 8.6C490 7.8 525 4.5 575-4.5" fill="none" stroke="url(#mcStreak)" stroke-width="7" opacity=".55" filter="url(#mcF4)"/>
  <path d="M455 8.6C490 7.8 525 4.5 575-4.5" fill="none" stroke="url(#mcStreak)" stroke-width="2.6"/>
</g>

<!-- 3 · navy body and everything lit inside it -->
<path data-g="body" fill="url(#mcBase)"/>
<g clip-path="url(#mcBody)">
