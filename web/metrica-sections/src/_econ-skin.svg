<!-- 1 · light the card throws onto the section -->
<path data-g="body" fill="#3a95f6" opacity=".42" filter="url(#mcF14)" transform="translate(0 8)"/>
<path data-g="body" fill="none" stroke="#fff" stroke-width="5" opacity=".55" filter="url(#mcF4)"/>
<path data-g="edge" fill="none" stroke="#3d9ef7" stroke-width="12" opacity=".75" filter="url(#mcF4)" transform="translate(0 6)"/>
<path data-g="neon" fill="none" stroke="url(#mcSpillFade)" stroke-width="12" opacity=".75" filter="url(#mcF8)" transform="translate(0 5)"/>

