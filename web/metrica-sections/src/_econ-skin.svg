    <path d="M440 202C480 197.5 515 193.5 550 188C570 184.9 600 178.8 620 174C616 178.5 611 184.5 604 190C592 199 568 205 545 210L440 212Z" fill="url(#mcWedge)"/>
    <path d="M440 202C480 197.5 515 193.5 550 188C570 184.9 600 178.8 620 174C616 178.5 611 184.5 604 190C592 199 568 205 545 210L440 212Z" fill="url(#mcWedgeLight)"/>
    <path d="M545 210C568 205 592 199 604 190C611 184.5 616 178.5 620 174C645 168 672 153.8 690 138C700 129.2 709 118 711 112L760 112L760 260L545 260Z" fill="url(#mcUnderFill)"/>
