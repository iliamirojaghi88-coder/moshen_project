  <path d="M62 4.4C90 2.8 115 2.2 150 2.5L230 3" fill="none" stroke="url(#mcGlint)" stroke-width="5" filter="url(#mcF1)"/>
  <g opacity=".14" fill="#2a7ae0"><rect x="141" y="16" width="8" height="40" rx="1"/><rect x="152" y="26" width="8" height="30" rx="1"/><rect x="163" y="20" width="8" height="36" rx="1"/></g>
