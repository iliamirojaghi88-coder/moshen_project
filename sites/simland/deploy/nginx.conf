# SimLand — the same headers for nginx (inside the site's server { } block; not copied anywhere by the build).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# only in the HTTPS server block:
# add_header Strict-Transport-Security "max-age=31536000" always;
location = /index.html { add_header Cache-Control "no-cache" always; }
location /assets/resume/ { add_header Cache-Control "public, max-age=604800" always; }
gzip on;
gzip_types text/html;
