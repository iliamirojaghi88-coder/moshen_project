  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F5F9">
  <meta name="color-scheme" content="light">
  <script>
    // Before first paint: mark JS and pick the view from the URL, so the
    // right page shows immediately (#/products → products, anything else → home).
    (function (d) {
      d.classList.add('js');
      d.dataset.route = /^#\/products(\/|$)/.test(location.hash) ? 'products' : 'home';
    })(document.documentElement);
  </script>
