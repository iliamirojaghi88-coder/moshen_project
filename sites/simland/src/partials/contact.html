<section class="contact" id="contact" aria-labelledby="contact-title">
  <div class="contact-inner">
    <div class="contact-intro" data-reveal>
      <h2 class="section-title" id="contact-title" tabindex="-1">ارتباط با سیم‌لند</h2>
      <p class="section-lede">برای دریافت مشاوره، استعلام قیمت و ثبت سفارش با ما در ارتباط باشید.</p>
    </div>
    <ul class="contact-grid">
      <li class="contact-card" data-reveal style="--i:0">
        <span class="contact-icon"><svg aria-hidden="true"><use href="#i-phone"/></svg></span>
        <span class="contact-label">شماره تماس اول</span>
        <span class="contact-value" dir="ltr" data-contact-value="phone1">0912XXXXXXX</span>
        <a class="contact-action" data-contact-action="phone1" aria-disabled="true" role="link">تماس</a>
      </li>
      <li class="contact-card" data-reveal style="--i:1">
        <span class="contact-icon"><svg aria-hidden="true"><use href="#i-phone"/></svg></span>
        <span class="contact-label">شماره تماس دوم</span>
        <span class="contact-value" dir="ltr" data-contact-value="phone2">0990XXXXXXX</span>
        <a class="contact-action" data-contact-action="phone2" aria-disabled="true" role="link">تماس</a>
      </li>
      <li class="contact-card" data-reveal style="--i:2">
        <span class="contact-icon"><svg aria-hidden="true"><use href="#i-mail"/></svg></span>
        <span class="contact-label">ایمیل</span>
        <span class="contact-value" dir="ltr" data-contact-value="email">info@example.com</span>
        <a class="contact-action" data-contact-action="email" aria-disabled="true" role="link">ارسال ایمیل</a>
      </li>
      <li class="contact-card" data-reveal style="--i:3">
        <span class="contact-icon"><svg aria-hidden="true"><use href="#i-message"/></svg></span>
        <span class="contact-label">واتساپ</span>
        <span class="contact-value" data-contact-value="whatsapp">به‌زودی فعال می‌شود</span>
        <a class="contact-action" data-contact-action="whatsapp" aria-disabled="true" role="link">گفت‌وگو در واتساپ</a>
      </li>
    </ul>
  </div>
</section>
