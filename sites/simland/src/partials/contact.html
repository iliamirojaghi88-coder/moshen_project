<section class="ways" id="contact-ways" aria-labelledby="ways-title">
  <div class="ways-inner">
    <h2 class="visually-hidden" id="ways-title">راه‌های ارتباطی</h2>
    <ul class="ways-grid">
      <li class="way" data-reveal style="--i:0">
        <span class="gicon"><svg aria-hidden="true"><use href="#i-phone"/></svg></span>
        <span class="way-label">شماره تماس اول</span>
        <span class="way-value" dir="ltr" data-contact-value="phone1">0912XXXXXXX</span>
        <a class="way-action" data-contact-action="phone1" aria-disabled="true" role="link"><span>تماس</span><svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </li>
      <li class="way" data-reveal style="--i:1">
        <span class="gicon"><svg aria-hidden="true"><use href="#i-phone"/></svg></span>
        <span class="way-label">شماره تماس دوم</span>
        <span class="way-value" dir="ltr" data-contact-value="phone2">0990XXXXXXX</span>
        <a class="way-action" data-contact-action="phone2" aria-disabled="true" role="link"><span>تماس</span><svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </li>
      <li class="way" data-reveal style="--i:2">
        <span class="gicon"><svg aria-hidden="true"><use href="#i-mail"/></svg></span>
        <span class="way-label">ایمیل</span>
        <span class="way-value" dir="ltr" data-contact-value="email">info@example.com</span>
        <a class="way-action" data-contact-action="email" aria-disabled="true" role="link"><span>ارسال ایمیل</span><svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </li>
      <li class="way" data-reveal style="--i:3">
        <span class="gicon gicon-green"><svg aria-hidden="true"><use href="#i-message"/></svg></span>
        <span class="way-label">واتساپ</span>
        <span class="way-value" data-contact-value="whatsapp">به‌زودی فعال می‌شود</span>
        <a class="way-action" data-contact-action="whatsapp" aria-disabled="true" role="link"><span>گفت‌وگو در واتساپ</span><svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </li>
    </ul>
    <p class="ways-note">اطلاعات تماس این صفحه نمونه است و به‌زودی با اطلاعات واقعی جایگزین می‌شود.</p>
  </div>
</section>
