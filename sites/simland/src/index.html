<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf6ff">
  <meta name="color-scheme" content="light">
  <title>سیم‌لند | جریان مطمئن، اتصال ماندگار</title>
  <meta name="description" content="تأمین انواع سیم و کابل ساختمانی، صنعتی و تخصصی برای پروژه‌های امروز و فردا.">
  <script>document.documentElement.classList.add('js');</script>
<!-- head-assets -->
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#37b6ff"/><stop offset="1" stop-color="#0878f9"/></linearGradient>
  </defs>
  <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.9 20 7.3v9.4L12 21.1l-8-4.4V7.3Z"/><path d="m4.3 7.4 7.7 4.4 7.7-4.4M12 11.8v9.1"/><path d="m8.1 5.1 7.8 4.4" opacity=".55"/>
  </symbol>
  <symbol id="i-headset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.6 13.6v-1.8a7.4 7.4 0 0 1 14.8 0v1.8"/><rect x="3.6" y="12.6" width="4" height="6" rx="1.8"/><rect x="16.4" y="12.6" width="4" height="6" rx="1.8"/>
    <path d="M18.4 18.6c0 1.6-1.6 2.6-4.2 2.6h-1.6" />
  </symbol>
</svg>

<header class="topbar" data-topbar>
  <nav class="topnav" aria-label="منوی اصلی">
    <a class="topnav-item is-active" href="#top" aria-current="page">خانه</a>
    <a class="topnav-item" role="link" aria-disabled="true" title="به‌زودی">محصولات</a>
    <a class="topnav-item" role="link" aria-disabled="true" title="به‌زودی">ارتباط با ما</a>
  </nav>
</header>

<main id="top">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-copy">
      <h1 class="hero-title" id="hero-title"><span>جریان مطمئن،</span> <span class="accent">اتصال ماندگار</span></h1>
      <p class="hero-lede">تأمین انواع سیم و کابل ساختمانی، صنعتی و تخصصی برای پروژه‌های امروز و فردا.</p>
      <div class="hero-actions">
        <a class="btn btn-soft" href="#contact" data-scroll>
          <span>دریافت مشاوره</span>
          <svg class="btn-icon" aria-hidden="true"><use href="#i-headset"/></svg>
        </a>
        <a class="btn btn-primary" href="#products" data-scroll>
          <span>مشاهده محصولات</span>
          <svg class="btn-icon" aria-hidden="true"><use href="#i-box"/></svg>
        </a>
      </div>
    </div>
    <div class="scene" data-scene role="img" aria-label="کابل سفید سیم‌لند به شکل بی‌نهایت؛ کارخانه، توربین‌های بادی، ویلا، دکل برق و پنل خورشیدی روی آن">
<!-- hero-still -->
    </div>
  </section>
</main>

<!-- hero-data -->
<!-- body-scripts -->
</body>
</html>
