<header class="topbar" data-topbar>
  <nav class="topnav" aria-label="منوی اصلی">
    <a class="topnav-item is-active" href="#top" aria-current="page">خانه</a>
    <a class="topnav-item" role="link" aria-disabled="true" title="به‌زودی">محصولات</a>
    <a class="topnav-item" role="link" aria-disabled="true" title="به‌زودی">ارتباط با ما</a>
  </nav>
</header>

<main id="top">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-copy">
      <h1 class="hero-title" id="hero-title"><span>جریان مطمئن،</span> <span class="accent">اتصال ماندگار</span></h1>
      <p class="hero-lede">تأمین انواع سیم و کابل ساختمانی، صنعتی و تخصصی برای پروژه‌های امروز و فردا.</p>
    </div>
    <div class="scene" data-scene role="img" aria-label="کابل سفید سیم‌لند به شکل بی‌نهایت؛ کارخانه، توربین‌های بادی، ویلا، دکل برق و پنل خورشیدی روی آن">
<!-- hero-still -->
    </div>
    <div class="hero-actions">
      <a class="btn btn-soft" href="#contact" data-scroll>
        <span>دریافت مشاوره</span>
        <svg class="btn-icon" aria-hidden="true"><use href="#i-headset"/></svg>
      </a>
      <a class="btn btn-primary" href="#products" data-scroll>
        <span>مشاهده محصولات</span>
        <svg class="btn-icon" aria-hidden="true"><use href="#i-box"/></svg>
      </a>
    </div>
  </section>

  <section class="products" id="products" aria-labelledby="products-title">
    <header class="section-head">
      <p class="eyebrow">محصولات سیم‌لند</p>
      <h2 class="section-title" id="products-title">دسته‌بندی <span class="accent">محصولات</span></h2>
    </header>
    <div class="pgrid-wrap">
<!-- products -->
    </div>
  </section>
</main>
