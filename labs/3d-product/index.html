<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three.module.js",
          "three/addons/": "./assets/vendor/addons/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2");
        font-weight: 400;
        unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("assets/fonts/vazirmatn-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2");
        font-weight: 900;
        unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("assets/fonts/vazirmatn-latin-900-normal.woff2") format("woff2");
        font-weight: 900;
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      :root {
        --ground: #1a1613;
        --ink: #f3ece0;
        --accent: #d9a441;
        --muted: #a39a8c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Vazirmatn", sans-serif;
        color: var(--ink);
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #copy {
        position: absolute;
        right: 96px;
        left: 96px;
        bottom: 260px;
        text-align: right;
      }
      #kicker {
        font-size: 40px;
        font-weight: 400;
        color: var(--accent);
      }
      #title {
        margin-top: 12px;
        font-size: 112px;
        font-weight: 900;
        line-height: 1.15;
      }
      #spec {
        margin-top: 28px;
        font-size: 36px;
        font-weight: 400;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div id="copy" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <p id="kicker">ایران · نیمهٔ دوم سدهٔ ۱۷ میلادی</p>
        <h1 id="title">کاشی هفت‌رنگ</h1>
        <p id="spec">۲۲٫۲ × ۲۱٫۸ × ۲٫۲ سانتی‌متر · خمیر سنگی، لعاب هفت‌رنگ</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kicker", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.4);
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 2.6);
      tl.fromTo("#spec", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 3.1);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { HDRLoader } from "three/addons/loaders/HDRLoader.js";

      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false);
      renderer.toneMapping = THREE.AgXToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1613);
      const camera = new THREE.PerspectiveCamera(28, 1080 / 1920, 0.01, 20);

      // Warm key from top-left, cool rim behind; environment does the reflections.
      const key = new THREE.DirectionalLight(0xfff1dc, 2.4);
      key.position.set(-0.4, 0.9, 0.5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = key.shadow.camera.bottom = -0.3;
      key.shadow.camera.right = key.shadow.camera.top = 0.3;
      key.shadow.radius = 6;
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x9fb8ff, 1.2);
      rim.position.set(0.5, 0.3, -0.6);
      scene.add(rim);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.ShadowMaterial({ opacity: 0.45 }));
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const pivot = new THREE.Group();
      scene.add(pivot);

      const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
      function renderAt(t) {
        // Dolly from a low three-quarter view to a near-top-down hero, tile
        // standing up off the table as the camera settles.
        const k = ease(t / 3.2);
        const az = THREE.MathUtils.lerp(0.9, 0.18, k);
        const el = THREE.MathUtils.lerp(0.32, 1.05, k);
        const r = THREE.MathUtils.lerp(1.15, 1.25, k);
        camera.position.set(Math.sin(az) * Math.cos(el) * r, Math.sin(el) * r, Math.cos(az) * Math.cos(el) * r);
        camera.lookAt(0, 0.02, THREE.MathUtils.lerp(0, 0.08, k));
        pivot.rotation.set(0, THREE.MathUtils.lerp(-0.5, 0, k) + 0.03 * Math.sin(t * 0.8), 0);
        pivot.position.y = 0.06 + 0.004 * Math.sin(t * 1.3);
        if (scene.environment) scene.environmentRotation.y = t * 0.35; // highlights sweep over the glaze
        renderer.render(scene, camera);
      }

      const ready = Promise.all([
        new HDRLoader().loadAsync("assets/hdri/studio_small_09_2k.hdr").then((hdr) => {
          hdr.mapping = THREE.EquirectangularReflectionMapping;
          scene.environment = hdr;
          scene.environmentIntensity = 0.55;
        }),
        new GLTFLoader().loadAsync("assets/models/tile.web.glb").then((gltf) => {
          const tile = gltf.scene;
          tile.traverse((o) => {
            if (o.isMesh) o.castShadow = true;
          });
          // Blender exports Z-up slab lying flat; centre it on the pivot.
          const box = new THREE.Box3().setFromObject(tile);
          tile.position.sub(box.getCenter(new THREE.Vector3()));
          pivot.add(tile);
        }),
      ]).then(() => renderAt(0));

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["tile"] = ready;
      window.addEventListener("hf-seek", (e) => {
        renderAt(e.detail.time);
        e.detail.waitUntil?.(ready);
      });
      renderAt(0);
    </script>
  </body>
</html>
