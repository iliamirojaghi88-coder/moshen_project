<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>METRICA Hero Test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2546; }
  .hero { position: relative; width: 100%; height: 100vh; height: 100svh; overflow: hidden; }
  .bg, .bg img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bg img { object-fit: cover; object-position: 50% 50%; display: block; }
  /* subject is 1080x1424 (ratio 0.7584): fit 96% of width or 90% of height, whichever is smaller */
  .fg {
    position: absolute; left: 50%; bottom: 4vh; bottom: 4svh;
    width: min(96vw, 68.25vh); width: min(96vw, 68.25svh);
    height: auto; aspect-ratio: 1080 / 1424; transform: translateX(-50%); display: block;
  }
  #src { position: fixed; top: 0; left: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<main class="hero">
  <picture class="bg">
    <source media="(orientation: portrait)" srcset="assets/city-portrait.png">
    <img src="assets/city-landscape.png" alt="">
  </picture>
  <canvas class="fg" id="fg" width="1080" height="1424"></canvas>
</main>
<!-- colour (left half) + alpha matte (right half) in one H.264 stream: always in sync -->
<video id="src" src="assets/hero-stacked.mp4" muted autoplay loop playsinline preload="auto"></video>
<script>
(() => {
  const video = document.getElementById('src');
  const canvas = document.getElementById('fg');

  // Fallback (file:// in Chrome/Firefox blocks WebGL from reading the video, or no WebGL):
  // VP9 WebM with a real alpha channel, played directly.
  function fallback() {
    if (canvas.dataset.fallback) return;
    canvas.dataset.fallback = 1;
    const v = document.createElement('video');
    Object.assign(v, { src: 'assets/hero-alpha.webm', muted: true, autoplay: true, loop: true, playsInline: true });
    v.className = 'fg'; v.width = 1080; v.height = 1424;
    canvas.replaceWith(v); video.remove();
    v.play().catch(() => addEventListener('pointerdown', () => v.play(), { once: true }));
  }

  if (!video.canPlayType('video/mp4; codecs="avc1.640033"')) return fallback();
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl) return fallback();

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER,
    'attribute vec2 p; varying vec2 v;' +
    'void main(){ v = vec2(p.x * 0.5 + 0.5, 0.5 - p.y * 0.5); gl_Position = vec4(p, 0.0, 1.0); }'));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,
    '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n' +
    'uniform sampler2D t; varying vec2 v;' +
    'void main(){' +
    '  vec3 c = texture2D(t, vec2(v.x * 0.5, v.y)).rgb;' +          // straight colour
    '  float a = texture2D(t, vec2(0.5 + v.x * 0.5, v.y)).r;' +     // alpha matte
    '  a = clamp((a - 0.02) / 0.96, 0.0, 1.0);' +                   // drop codec noise around 0 / 1
    '  gl_FragColor = vec4(c * a, a);' +                            // premultiplied over the city image
    '}'));
  gl.bindAttribLocation(prog, 0, 'p');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return fallback();
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);

  let failed = false;
  function draw() {
    if (failed || video.readyState < 2) return;
    try {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    } catch (e) { failed = true; return fallback(); }
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
    const onFrame = () => { draw(); video.requestVideoFrameCallback(onFrame); };
    video.requestVideoFrameCallback(onFrame);
  } else {
    let last = -1;
    (function tick() {
      if (video.currentTime !== last) { last = video.currentTime; draw(); }
      requestAnimationFrame(tick);
    })();
  }
  video.addEventListener('loadeddata', draw);   // show frame 1 even before playback starts
  video.addEventListener('seeked', draw);

  // autoplay can be refused (e.g. iOS Low Power Mode): start on the first touch/click
  video.play().catch(() => addEventListener('pointerdown', () => video.play(), { once: true }));
})();
</script>
</body>
</html>
