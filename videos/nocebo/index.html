<!doctype html>
<html
  lang="fa"
  dir="rtl"
  data-composition-variables='[
    {"id":"color-night","type":"color","label":"Night ground","default":"#070C16"},
    {"id":"color-ink","type":"color","label":"Ink on dark","default":"#F3F1EC"},
    {"id":"color-lab-ink","type":"color","label":"Ink on bright","default":"#13213A"},
    {"id":"color-cold","type":"color","label":"Cold blue","default":"#8FB4E3"},
    {"id":"color-accent","type":"color","label":"Amber accent","default":"#F2B36B"},
    {"id":"font-display","type":"string","label":"Display font","default":"Estedad"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Everything is local: renders never fetch from a CDN. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js" } }
    </script>
    <style>
      @font-face {
        font-family: "Estedad";
        src: url("assets/fonts/estedad-arabic.woff2") format("woff2");
        font-weight: 100 900;
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      @font-face {
        font-family: "Estedad";
        src: url("assets/fonts/estedad-latin.woff2") format("woff2");
        font-weight: 100 900;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --color-night: #070c16;
        --color-ink: #f3f1ec;
        --color-lab-ink: #13213a;
        --color-cold: #8fb4e3;
        --color-accent: #f2b36b;
        --font-display: "Estedad";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-night);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display), sans-serif;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-night);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="81" data-width="1080" data-height="1920">
      <div id="ground"></div>

      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="5.75" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2-unwell.html" data-start="5.75" data-duration="13.25" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3-talghin.html" data-start="19" data-duration="3.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4-expectation.html" data-start="22.6" data-duration="17.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5-amplify.html" data-start="40.1" data-duration="13.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6-nocebo.html" data-start="53.7" data-duration="7.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7-conclusion.html" data-start="61" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s8" data-composition-id="s8" data-composition-src="compositions/s8-question.html" data-start="69" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="voice" class="clip" src="assets/audio/voice.mp3" data-start="0.3" data-track-index="10" data-volume="1"></audio>
      <!-- music bed + effects, pre-mixed and ducked under the voice by tools/mix_score.py -->
      <audio id="score" class="clip" src="assets/audio/score.wav" data-start="0" data-track-index="11" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
