<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #04060a;
    }
    #s6-gl {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
  </style>
  <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
    <canvas id="s6-gl" class="clip" width="1080" height="1920" data-start="0" data-duration="7.3" data-track-index="0"></canvas>
  </div>
  <script>
    window.__timelines["s6"] = gsap.timeline({ paused: true });
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady["s6-gl"] = new Promise((resolve) => (window.__s6Ready = resolve));
  </script>
  <script type="module">
    import * as THREE from "three";
    import { RoomEnvironment } from "./assets/vendor/jsm/environments/RoomEnvironment.js";
    import { RectAreaLightUniformsLib } from "./assets/vendor/jsm/lights/RectAreaLightUniformsLib.js";
    import { EffectComposer } from "./assets/vendor/jsm/postprocessing/EffectComposer.js";
    import { RenderPass } from "./assets/vendor/jsm/postprocessing/RenderPass.js";
    import { BokehPass } from "./assets/vendor/jsm/postprocessing/BokehPass.js";
    import { OutputPass } from "./assets/vendor/jsm/postprocessing/OutputPass.js";
    import glyphs from "./assets/data/glyphs.js";
    import { buildWord, ease, span } from "./assets/js/type3d.js";
    import { growNeuron, tissueMaterial } from "./assets/js/neuro.js";

    const S6_START = 53.7;
    const REVEAL = 4.88; // «اثر نوسیبو» is spoken at 58.58
    RectAreaLightUniformsLib.init();

    const canvas = document.getElementById("s6-gl");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    const DPR = window.devicePixelRatio || 1; // 2 for high-density stills (the cover)
    renderer.setPixelRatio(DPR);
    renderer.setSize(1080, 1920, false);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.VSMShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04060a);
    scene.fog = new THREE.Fog(0x04060a, 9, 26);
    const pm = new THREE.PMREMGenerator(renderer);
    const studioEnv = pm.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = studioEnv;
    scene.environmentIntensity = 0.08;

    // Black studio floor: satin, so the strip light draws a long highlight on it.
    // matte enough that the back rim leaves no sheen; lit by the strip and the top spot
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(16, 96),
      new THREE.MeshPhysicalMaterial({ color: 0x07090d, roughness: 0.62, specularIntensity: 0.5, envMap: studioEnv, envMapIntensity: 0.006 }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // The title: champagne metal, «اثر» above «نوسیبو».
    const metal = new THREE.MeshPhysicalMaterial({ color: 0xe2b77f, metalness: 1.0, roughness: 0.28, clearcoat: 0.35, clearcoatRoughness: 0.2, envMap: studioEnv, envMapIntensity: 0.012 });
    const lineA = buildWord(glyphs.asar, { height: 0.44, depth: 0.22, bevel: 0.016, bodyMat: metal });
    const lineB = buildWord(glyphs.nosibo, { height: 0.6, depth: 0.22, bevel: 0.016, bodyMat: metal });
    const title = new THREE.Group();
    lineA.group.position.set(0, 1.3, 0);
    lineB.group.position.set(0, 0.55, 0);
    title.add(lineA.group, lineB.group);
    scene.add(title);

    // Behind it, a graphite neuron turning slowly, rim-lit: the science, quietly.
    const graphite = tissueMaterial({ color: 0x3a3f48, roughness: 0.42, clearcoat: 0.5, sheen: 0.2, sheenColor: 0x8fa6c8, speed: 1.2, bump: 0.25 });
    const sculpt = growNeuron({ seed: 5813, center: new THREE.Vector3(0, 0, 0), somaR: 0.42, dendrites: 9, depth: 4, reach: 2.6, dendriteR: 0.2 });
    const sculpture = new THREE.Mesh(sculpt.cell, graphite);
    sculpture.position.set(0.4, 3.0, -5.5);
    sculpture.castShadow = true;
    scene.add(sculpture);

    // Light: a cold rim from behind, a soft top key, and the strip that sweeps.
    const rim = new THREE.DirectionalLight(0x8fb4e3, 1.6);
    rim.position.set(-2, 5, -9);
    scene.add(rim);
    const top = new THREE.SpotLight(0xfff0dc, 26, 18, 0.55, 0.85, 1.6);
    top.position.set(-1.5, 7.5, 2.5);
    top.target.position.set(0, 0.6, 0);
    top.castShadow = true;
    top.shadow.mapSize.set(2048, 2048);
    top.shadow.radius = 10;
    top.shadow.blurSamples = 16;
    scene.add(top, top.target);
    const strip = new THREE.RectAreaLight(0xfff3e2, 0, 0.22, 5.0);
    scene.add(strip);

    const camera = new THREE.PerspectiveCamera(30, 1080 / 1920, 0.1, 60);
    // 4x MSAA in the post chain: thin fibres and letter bevels stay clean
    const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1080 * DPR, 1920 * DPR, { type: THREE.HalfFloatType, samples: 4 }));
    composer.addPass(new RenderPass(scene, camera));
    const bokeh = new BokehPass(scene, camera, { focus: 7, aperture: 0.004, maxblur: 0.012 });
    composer.addPass(bokeh);
    composer.addPass(new OutputPass());

    const all = [...lineA.glyphs, ...lineB.glyphs];
    function renderAt(t) {
      const lt = t - S6_START;
      if (lt < -0.05 || lt > 7.35) return;
      // Out of the dark: the studio is found by its rim light first.
      const open = ease.cubicInOut(span(lt, 0.0, 1.6));
      rim.intensity = 1.6 * (0.35 + 0.65 * open);
      const lit = ease.cubicInOut(span(lt, REVEAL - 0.05, REVEAL + 0.9));
      top.intensity = 26 * lit;
      metal.envMapIntensity = 0.012 + 0.9 * ease.cubicInOut(span(lt, REVEAL - 0.2, REVEAL + 1.1));

      // The strip light crosses right to left on the spoken term, then rests.
      const sw = ease.cubicInOut(span(lt, REVEAL - 0.25, REVEAL + 1.05));
      strip.intensity = 30 * Math.min(1, span(lt, REVEAL - 0.3, REVEAL)) * (1 - 0.35 * span(lt, REVEAL + 1.0, REVEAL + 2.2));
      strip.position.set(2.6 - 5.2 * sw, 1.0, 1.6);
      strip.lookAt(0, 1.0, 0);

      // The letters rise a few centimetres as they are lit, one after another (RTL).
      all.forEach((g, i) => {
        const order = g.rest.x * -1;
        const k = ease.expoOut(span(lt, REVEAL - 0.35 + order * 0.08, REVEAL + 0.75 + order * 0.08));
        g.mesh.position.copy(g.rest);
        g.mesh.position.y -= 0.12 * (1 - k);
        g.mesh.position.z -= 0.25 * (1 - k);
      });

      sculpture.rotation.y = 0.35 + lt * 0.05;
      sculpture.rotation.x = 0.15 + lt * 0.012;
      graphite.userData.uniforms.uTime.value = lt;
      graphite.userData.uniforms.uActivity.value = 0.12 + 0.3 * span(lt, 1, REVEAL);

      const d = ease.cubicInOut(span(lt, 0, 7.3));
      camera.position.set(0.5 - 0.7 * d, 1.2 + 0.1 * d, 8.3 - 0.7 * d);
      camera.lookAt(0, 1.05, 0);
      bokeh.uniforms.focus.value = camera.position.distanceTo(new THREE.Vector3(0, 1.0, 0));
      renderer.toneMappingExposure = 1.1 * (1 - ease.cubicIn(span(lt, 6.95, 7.3)));
      composer.render();
    }
    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    window.__s6Ready();
  </script>
</template>
